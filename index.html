<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gambit Chess</title>
<!-- 홈 화면에 추가하면 앱처럼 뜬다. 아이콘은 tools/make-icons.mjs 가 그린다. -->
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="theme-color" content="#262421" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Gambit" />
<style>
  :root {
    --light: #eeddc0;
    --dark: #b58863;
    --bg: #262421;
    --panel: #312e2b;
    --text: #e8e6e3;
    --accent: #7fa650;
    --danger: #e5484d;
    --crit: #f5b942;
    /* 반상 위 표시. three.js 재질도 여기서 읽는다 — 색 정의는 이 블록 하나뿐이다. */
    --team-light: #f4f1ea;
    --team-dark: #211d1a;
    --last: #ffe066;
    /* 아이템 — 색으로 종류를 구분한다 */
    --item-again: #5aa9e6;
    --item-sharp: #f5b942;
    --item-rage: #e5484d;
    --item-mend: #7fa650;
    --buff: #c77dff;
  }
  * { box-sizing: border-box; }
  body {
    /* dvh 는 주소창이 여닫혀도 흔들리지 않는다. 100vh 는 그 값을 모르는 브라우저용. */
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    /* 더블탭 확대와 그에 딸린 300ms 지연을 없앤다. 손가락 두 개 확대는 남는다. */
    touch-action: manipulation;
    /* 터치로 칸을 누르면 브라우저가 캔버스를 "선택" 해 판 전체에 파란 막을 씌운다.
       빠르게 두 번 누르면 특히 잘 뜬다. 게임 화면에서 고를 것은 칸이지 요소가 아니다. */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 기보는 예외 — 복사할 수 있어야 한다. */
  #moves { -webkit-user-select: text; user-select: text; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .06em; }
  #board {
    /* 82vh 항목이 세로 제약이다. 가로만 걸면 제목·기보까지 더한 페이지가 화면을 넘겨
       반상 아래쪽이 잘린다 (aspect-ratio 1.32 → 높이 = 너비 / 1.32). */
    display: block; width: min(92vw, 1000px, 82vh); aspect-ratio: 1.32;
    border-radius: 6px; box-shadow: 0 8px 32px #0008; touch-action: none; cursor: pointer;
    /* 길게 눌러도 이미지 저장 메뉴가 뜨지 않는다 — 반상은 그림이 아니라 조작면이다. */
    -webkit-touch-callout: none;
  }

  /* ---- 폰 ----
     반상은 가로로 긴 캔버스인데 폰 화면은 세로로 길다. 비율을 그대로 두면 폭에 눌려
     납작해지고 아래로 300px 가 빈다 — 반상이 화면을 지배한다는 원칙과 정반대가 된다.
     그래서 화면 모양에 맞춰 캔버스 비율 자체를 바꾼다. 카메라는 좁아진 만큼 뒤로
     물러선다 (board3d 의 pullBack). */
  @media (orientation: portrait) and (max-width: 560px) {
    body { gap: 10px; padding: 10px; }
    #board { width: min(96vw, calc(62vh * 0.92)); aspect-ratio: 0.92; }
    #moves { max-height: 48px; }
  }

  /* 가로로 눕힌 폰은 높이가 없다. 제목을 빼고 여백을 줄여야 스크롤이 안 생기고,
     반상은 남는 가로 폭을 쓰도록 더 넓은 비율로 간다. */
  @media (orientation: landscape) and (max-height: 520px) {
    body { gap: 6px; padding: 8px; }
    h1 { display: none; }
    #board { width: min(96vw, calc(55vh * 1.7)); aspect-ratio: 1.7; }
    #moves { max-height: 30px; padding: 4px 12px; }
    #legend { font-size: 12px; }
  }
  #panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid #4a4643;
    border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover:enabled, select:hover:enabled { border-color: var(--accent); }
  button:disabled, select:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 1.5em; font-weight: 600; }
  #moves {
    width: min(92vw, 1000px); max-height: 66px; overflow-y: auto;
    background: var(--panel); border-radius: 6px; padding: 8px 12px;
    font-size: 13px; color: #b6b2ae; word-break: break-all;
  }
  #moves .repelled { color: var(--danger); }

  /* 반상에 놓인 아이템 안내. 색만 봐서는 효과를 알 수 없다. */
  #legend[hidden] { display: none; }
  #legend {
    width: min(92vw, 1000px); display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 13px; color: #b6b2ae;
  }
  #legend .item { display: inline-flex; align-items: center; gap: 6px; }
  #legend .item i { width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); }

  /* ---- 연승 런 ----
     상태줄이 "지금 이 판", 여기가 "지금 이 런". 얻은 강화는 다음 판에도 남으므로
     반상 밖에 계속 떠 있어야 한다. */
  #run[hidden] { display: none; }
  #run {
    width: min(92vw, 1000px); display: flex; gap: 6px 14px; flex-wrap: wrap;
    justify-content: center; font-size: 13px; color: #b6b2ae;
  }
  #run b { color: var(--accent); font-weight: 700; }
  #run .up { color: var(--buff); }

  /* 승리·패배 뒤에만 뜬다. 판이 끝난 순간이라 반상을 덮어도 가릴 정보가 없다. */
  #reward[hidden] { display: none; }
  #reward {
    position: fixed; inset: 0; z-index: 5; padding: 20px;
    display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center;
    background: #000000d0; text-align: center;
  }
  #reward .head { font-size: 19px; font-weight: 700; }
  #reward .sub { font-size: 14px; color: #b6b2ae; }
  #reward .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #reward .card {
    width: 168px; padding: 14px; text-align: left; line-height: 1.45;
    background: var(--panel); border: 1px solid #4a4643; border-radius: 8px;
    color: var(--text); font: inherit; cursor: pointer;
  }
  #reward .card:hover { border-color: var(--accent); }
  #reward .card b { display: block; margin-bottom: 4px; }
  #reward .card span { font-size: 13px; color: #b6b2ae; }

  /* ---- 전투 계기판 ----
     전투 자체는 반상 위에서 벌어진다. 여기는 HP 처럼 3D 로 읽기 어려운 수치만 맡는다. */
  #duel[hidden] { display: none; }
  #duel {
    width: min(92vw, 1000px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px;
    background: var(--panel); border-radius: 6px; padding: 10px 14px;
  }
  #duel .side { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  #duel .side.def { align-items: flex-end; }
  #duel .who { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  #duel .side.def .who { flex-direction: row-reverse; }
  #duel .name { font-weight: 600; white-space: nowrap; }
  #duel .dmg { font-weight: 700; color: var(--danger); opacity: 0; }
  #duel .dmg.show { animation: pop .45s ease-out; }
  #duel .dmg.crit { color: var(--crit); }
  @keyframes pop { from { opacity: 1; transform: translateY(0) } to { opacity: 0; transform: translateY(-9px) } }
  #duel .bar { width: 100%; height: 8px; border-radius: 6px; background: #0006; overflow: hidden; }
  #duel .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .2s ease-out; }
  #duel .bar i.hurt { background: var(--danger); }
  #duel .side.def .bar i { margin-left: auto; }
  #duel .vs { font-size: 12px; letter-spacing: .18em; color: #b6b2ae; }
</style>
</head>
<body>
  <h1>♞ GAMBIT CHESS</h1>
  <div id="status"></div>
  <div id="run" hidden></div>
  <div id="reward" hidden>
    <div class="head"></div>
    <div class="sub"></div>
    <div class="cards"></div>
  </div>
  <div id="duel" hidden>
    <div class="side atk">
      <div class="who"><span class="name"></span><span class="dmg"></span></div>
      <div class="bar"><i></i></div>
    </div>
    <div class="vs">VS</div>
    <div class="side def">
      <div class="who"><span class="name"></span><span class="dmg"></span></div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <canvas id="board"></canvas>
  <div id="legend" hidden></div>
  <div id="panel">
    <select id="mode">
      <option value="duel">결투 모드</option>
      <option value="classic">정통 체스</option>
    </select>
    <select id="side">
      <option value="w">백(선공)</option>
      <option value="b">흑(후공)</option>
    </select>
    <select id="level"></select>
    <button id="undo">무르기</button>
    <button id="new">새 게임</button>
  </div>
  <div id="moves"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
