<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gambit Chess</title>
<!-- 홈 화면에 추가하면 앱처럼 뜬다. 아이콘은 tools/make-icons.mjs 가 그린다. -->
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="theme-color" content="#262421" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Gambit" />
<style>
  :root {
    --light: #eeddc0;
    --dark: #b58863;
    --bg: #262421;
    --panel: #312e2b;
    --text: #e8e6e3;
    --accent: #7fa650;
    --danger: #e5484d;
    --crit: #f5b942;
    /* 반상 위 표시. three.js 재질도 여기서 읽는다 — 색 정의는 이 블록 하나뿐이다. */
    --team-light: #f4f1ea;
    --team-dark: #211d1a;
    --last: #ffe066;
    /* 반상을 받치는 바닥 — 풍화된 널판.
       사진에서 잰 #838386 은 직사광이 섞인 값이라 알베도가 아니고, 탈조명 추출값은
       #4a494c 다. 그런데 그 값으로 깔면 이 장면에서는 숯색으로 착지한다 — 레퍼런스는
       한낮 직사광이고 여기 조명은 그보다 훨씬 약하기 때문이다. 재현할 것은 알베도 숫자가
       아니라 "풍화된 은회색으로 보인다" 는 쪽이라, 둘 사이로 올렸다. */
    --table: #5f5e61;
    /* 반상 나무 — 테두리는 두 칸 색 사이 */
    --board-frame: #ddc4a4;
    /* 아이템 — 색으로 종류를 구분한다 */
    --item-again: #5aa9e6;
    --item-sharp: #f5b942;
    --item-rage: #e5484d;
    --item-mend: #7fa650;
    --buff: #c77dff;
  }
  * { box-sizing: border-box; }
  body {
    /* dvh 는 주소창이 여닫혀도 흔들리지 않는다. 100vh 는 그 값을 모르는 브라우저용. */
    margin: 0; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
    /* 더블탭 확대와 그에 딸린 300ms 지연을 없앤다. 손가락 두 개 확대는 남는다. */
    touch-action: manipulation;
    /* 터치로 칸을 누르면 브라우저가 캔버스를 "선택" 해 판 전체에 파란 막을 씌운다.
       빠르게 두 번 누르면 특히 잘 뜬다. 게임 화면에서 고를 것은 칸이지 요소가 아니다. */
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  /* 기보는 예외 — 복사할 수 있어야 한다. */
  #moves { -webkit-user-select: text; user-select: text; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .06em; }
  #board {
    /* 82vh 항목이 세로 제약이다. 가로만 걸면 제목·기보까지 더한 페이지가 화면을 넘겨
       반상 아래쪽이 잘린다 (aspect-ratio 1.32 → 높이 = 너비 / 1.32). */
    display: block; width: min(92vw, 1000px, 82vh); aspect-ratio: 1.32;
    border-radius: 6px; box-shadow: 0 8px 32px #0008; touch-action: none; cursor: pointer;
    /* 길게 눌러도 이미지 저장 메뉴가 뜨지 않는다 — 반상은 그림이 아니라 조작면이다.
       상속으로 될 것 같지만 안드로이드 크롬·삼성 인터넷에서 캔버스가 통째로 파랗게
       번쩍이는 일이 있어, 물려받는 값이라도 여기에 다시 적는다. */
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ---- 전투 계기판 ----
     전투 자체는 반상 위에서 벌어진다. 여기는 HP 처럼 3D 로 읽기 어려운 수치만 맡는다. */
  #duel[hidden] { display: none; }
  #duel {
    width: min(92vw, 1000px);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px;
    background: var(--panel); border-radius: 6px; padding: 10px 14px;
  }
  #duel .side { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  #duel .side.def { align-items: flex-end; }
  /* 좁은 폰에서는 이름·체력이 한 줄에 안 들어간다. 넘치면 접는다 — 잘리는 것보다 낫다. */
  #duel .who { display: flex; gap: 4px 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  #duel .side.def .who { flex-direction: row-reverse; }
  #duel .name { font-weight: 600; white-space: nowrap; }
  #duel .hp { white-space: nowrap; color: #b6b2ae; }
  #duel .dmg { font-weight: 700; color: var(--danger); opacity: 0; }
  #duel .dmg.show { animation: pop .45s ease-out; }
  #duel .dmg.crit { color: var(--crit); }
  @keyframes pop { from { opacity: 1; transform: translateY(0) } to { opacity: 0; transform: translateY(-9px) } }
  #duel .bar { width: 100%; height: 8px; border-radius: 6px; background: #0006; overflow: hidden; }
  /* 색이 곧 누구인가다 — 내 기물은 초록, 상대는 빨강. 남은 체력은 길이가 말한다.
     예전에는 피가 깎이면 초록이 빨강으로 변해서, 색을 보고는 편을 알 수 없었다. */
  #duel .bar i { display: block; height: 100%; width: 100%; background: var(--danger); transition: width .2s ease-out; }
  #duel .side.mine .bar i { background: var(--accent); }
  #duel .side.def .bar i { margin-left: auto; }
  #duel .side .tag { font-size: 11px; padding: 1px 5px; border-radius: 4px; background: var(--danger); color: #fff; }
  #duel .side.mine .tag { background: var(--accent); }
  #duel .vs { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
  #duel .odds { font-size: 14px; font-weight: 700; }
  /* 건너뛰기는 이 버튼으로만 받는다 — 반상 아무 데나 누르는 것과 섞이면 안 된다. */
  #duel .skip { padding: 3px 9px; font-size: 11px; line-height: 1.5; white-space: nowrap; color: #b6b2ae; }
  #panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid #4a4643;
    border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover:enabled, select:hover:enabled { border-color: var(--accent); }
  button:disabled, select:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 1.5em; font-weight: 600; }
  #moves {
    width: min(92vw, 1000px); max-height: 66px; overflow-y: auto;
    background: var(--panel); border-radius: 6px; padding: 8px 12px;
    font-size: 13px; color: #b6b2ae; word-break: break-all;
  }
  #moves .repelled { color: var(--danger); }

  /* 가로에서만 쓰는 접기 버튼. 세로·데스크톱에서는 컨트롤이 늘 보이므로 아예 없앤다.
     보이고 감추는 것은 CSS 가 정한다 — 그래서 markup 의 hidden 을 JS 로 벗기지 않는다. */
  #menu { display: none; font-size: 18px; line-height: 1; padding: 6px 10px; }

  /* 아이폰에만 뜨는 설치 안내. 한 번 닫으면 다시 안 뜬다. */
  #install[hidden] { display: none; }
  #install {
    display: flex; align-items: center; gap: 10px;
    max-width: min(92vw, 1000px); font-size: 13px; color: #b6b2ae;
    background: var(--panel); border-radius: 6px; padding: 7px 12px;
  }
  #install b { color: var(--text); font-weight: 600; }
  #install button { padding: 2px 8px; font-size: 12px; line-height: 1.6; }

  /* 반상에 놓인 아이템 안내. 색만 봐서는 효과를 알 수 없다. */
  #legend[hidden] { display: none; }
  #legend {
    width: min(92vw, 1000px); display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 13px; color: #b6b2ae;
  }
  #legend .item { display: inline-flex; align-items: center; gap: 6px; }
  #legend .item i { font-style: normal; font-size: 15px; line-height: 1; }

  /* ---- 연승 런 ----
     상태줄이 "지금 이 판", 여기가 "지금 이 런". 얻은 강화는 다음 판에도 남으므로
     반상 밖에 계속 떠 있어야 한다. */
  #run[hidden] { display: none; }
  #run {
    width: min(92vw, 1000px); display: flex; gap: 6px 14px; flex-wrap: wrap;
    justify-content: center; font-size: 13px; color: #b6b2ae;
  }
  #run b { color: var(--accent); font-weight: 700; }
  #run .up { color: var(--buff); }

  /* 승리·패배 뒤에만 뜬다. 판이 끝난 순간이라 반상을 덮어도 가릴 정보가 없다. */
  #reward[hidden] { display: none; }
  #reward {
    position: fixed; inset: 0; z-index: 5; padding: 20px;
    display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center;
    background: #000000d0; text-align: center;
  }
  #reward .head { font-size: 19px; font-weight: 700; }
  #reward .sub { font-size: 14px; color: #b6b2ae; }
  #reward .cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #reward .card {
    width: 168px; padding: 14px; text-align: left; line-height: 1.45;
    background: var(--panel); border: 1px solid #4a4643; border-radius: 8px;
    color: var(--text); font: inherit; cursor: pointer;
  }
  #reward .card:hover { border-color: var(--accent); }
  #reward .card b { display: block; margin-bottom: 4px; }
  #reward .card span { font-size: 13px; color: #b6b2ae; }
  /* ---- 화면 크기별 조정 ----
     같은 특정도(#id)면 나중에 온 규칙이 이긴다. 그래서 이 블록은 반드시 맨 뒤에 있어야
     한다 — 앞에 두면 #moves 같은 기본 규칙에 덮여 조용히 무시된다. ---- 폰 ----
     반상은 가로로 긴 캔버스인데 폰 화면은 세로로 길다. 비율을 그대로 두면 폭에 눌려
     납작해지고 아래로 300px 가 빈다 — 반상이 화면을 지배한다는 원칙과 정반대가 된다.
     그래서 화면 모양에 맞춰 캔버스 비율 자체를 바꾼다. 카메라는 좁아진 만큼 뒤로
     물러선다 (board3d 의 pullBack). */
  /* 폰이면 세로든 가로든 컨트롤을 접는다. 늘 펼쳐 두면 반상이 그만큼 밀린다.
     펼친 패널은 반상 위에 떠오른다 — 자리를 차지하면 열고 닫을 때마다 반상이 흔들리고,
     3D 캔버스는 그때마다 리사이즈와 카메라 재계산까지 따라온다. */
  @media (max-width: 560px), (max-height: 560px) {
    /* 여는 버튼은 화면 구석에 뜬다. 줄 하나를 차지하면 그만큼 반상이 밀린다 —
       버튼 하나 때문에 자리를 내줄 이유가 없다. */
    #menu {
      display: block; position: fixed; z-index: 5;
      padding: 8px 11px; opacity: .9;
      /* 노치·상태바 밑으로 들어가지 않게. 브라우저에서는 0 이라 아무것도 안 바뀐다. */
      right: calc(10px + env(safe-area-inset-right, 0px));
    }
    /* 펼친 패널은 버튼 아래에서 열린다 — 누른 자리에서 나와야 어디서 나온 것인지 읽힌다. */
    #panel { right: calc(10px + env(safe-area-inset-right, 0px)); left: auto; transform: none; }
    #panel {
      display: none; position: fixed; z-index: 4;
      flex-direction: column; align-items: stretch; width: 172px;
      background: #262421f2; border: 1px solid #4a4643; border-radius: 8px;
      padding: 10px; box-shadow: 0 8px 32px #000a;
    }
    body.controls #panel { display: flex; }
  }

  @media (orientation: portrait) and (max-width: 560px) {
    body { gap: 10px; padding: 10px; }
    #board { width: min(96vw, calc(66vh * 0.92)); aspect-ratio: 0.92; }
    #moves { max-height: 48px; }
    /* 제목 줄 오른쪽에 앉힌다. 반상 아래쪽은 기물이 서 있고 손가락이 오가는 자리라
       버튼을 거기 두면 잘못 눌린다. 패널은 버튼 밑으로 펼쳐진다. */
    body { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
    /* top 은 main.ts 의 alignMenu 가 제목 줄에 맞춰 넣는다. 여기 값은 그 전 한 순간용. */
    #menu { top: calc(12px + env(safe-area-inset-top, 0px)); }
    #panel { top: calc(56px + env(safe-area-inset-top, 0px)); }

  }

  /* 가로로 눕힌 폰은 높이가 없고 폭이 남는다. 세로 한 줄을 고집하면 반상이 높이에 눌려
     작아지면서 좌우가 통째로 빈다 — 그래서 여기서만 두 칸으로 간다.
     반상이 왼쪽에서 높이를 다 쓰고, 나머지는 오른쪽 좁은 칸에 쌓인다. */
  /* 눕힌 폰은 높이가 없다. 반상이 높이를 다 쓰고, 나머지는 전부 구석에 띄운다 —
     띠를 하나라도 세우면 그 폭만큼 반상이 작아진다. */
  @media (orientation: landscape) and (max-height: 560px) {
    body { gap: 0; padding: 6px; }
    h1, #moves { display: none; } /* 기보는 가로에서 접는다 — 반상이 먼저다 */
    #board { width: min(calc(96vh * 1.32), 97vw); aspect-ratio: 1.32; }
    /* 상태·연승은 반상 위 오른쪽 구석에 겹친다. 한 줄짜리 글이라 반상을 가리지 않는다. */
    #status, #run {
      position: fixed; right: calc(12px + env(safe-area-inset-right, 0px));
      text-align: right; z-index: 3;
    }
    #status { top: calc(8px + env(safe-area-inset-top, 0px)); }
    #run { top: calc(32px + env(safe-area-inset-top, 0px)); justify-content: flex-end; }
    #menu { top: calc(62px + env(safe-area-inset-top, 0px)); }
    #panel { top: calc(100px + env(safe-area-inset-top, 0px)); }
    #duel, #legend { position: fixed; left: 8px; right: 8px; bottom: 6px; z-index: 3; width: auto; }
    #legend { font-size: 12px; }
  }
</style>
</head>
<body>
  <h1>♞ GAMBIT CHESS</h1>
  <div id="status"></div>
  <div id="run" hidden></div>
  <!-- iOS 는 설치 배너를 띄우지 않는다. 공유 시트로 들어가는 길을 한 줄로 알려 준다. -->
  <div id="install" hidden></div>
  <div id="reward" hidden>
    <div class="head"></div>
    <div class="sub"></div>
    <div class="cards"></div>
  </div>
  <div id="duel" hidden>
    <div class="side atk">
      <div class="who"><span class="tag"></span><span class="name"></span><span class="hp"></span><span class="dmg"></span></div>
      <div class="bar"><i></i></div>
    </div>
    <div class="vs"><span class="odds"></span><button class="skip">건너뛰기</button></div>
    <div class="side def">
      <div class="who"><span class="tag"></span><span class="name"></span><span class="hp"></span><span class="dmg"></span></div>
      <div class="bar"><i></i></div>
    </div>
  </div>
  <canvas id="board"></canvas>
  <div id="legend" hidden></div>
  <button id="menu" aria-label="설정 열기">☰</button>
  <div id="panel">
    <select id="mode">
      <option value="duel">결투 모드</option>
      <option value="classic">정통 체스</option>
    </select>
    <select id="side">
      <option value="w">백(선공)</option>
      <option value="b">흑(후공)</option>
    </select>
    <select id="level"></select>
    <button id="undo">무르기</button>
    <button id="new">새 게임</button>
  </div>
  <div id="moves"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
