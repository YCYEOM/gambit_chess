<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gambit Chess</title>
<style>
  :root {
    --light: #eeddc0;
    --dark: #b58863;
    --bg: #262421;
    --panel: #312e2b;
    --text: #e8e6e3;
    --accent: #7fa650;
    --danger: #e5484d;
    --crit: #f5b942;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: .06em; }
  #board {
    /* 행도 1fr 로 못 박는다. 안 그러면 행 높이가 내용을 따라가서
       기물 없는 가로줄만 얇아진다. */
    display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr);
    width: min(88vw, 88vh, 560px); aspect-ratio: 1;
    border-radius: 6px; overflow: hidden; box-shadow: 0 8px 32px #0008;
  }
  .sq {
    display: flex; align-items: center; justify-content: center;
    font-size: min(9vw, 9vh, 54px); line-height: 1; cursor: pointer;
    position: relative; user-select: none;
  }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .sq.sel { box-shadow: inset 0 0 0 4px var(--accent); }
  .sq.last { background-image: linear-gradient(#ffe06655, #ffe06655); }
  .sq.check { background-image: radial-gradient(circle, #e5484d 10%, transparent 70%); }
  .sq.move::after {
    content: ''; position: absolute; width: 28%; aspect-ratio: 1;
    border-radius: 50%; background: #0004;
  }
  .sq.move.cap::after { width: 84%; border-radius: 50%; background: none; box-shadow: inset 0 0 0 5px #0004; }
  .w { color: #fff; text-shadow: 0 0 2px #000, 0 1px 2px #0009; }
  .b { color: #1a1a1a; text-shadow: 0 0 2px #fff6; }
  #panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid #4a4643;
    border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover:enabled, select:hover:enabled { border-color: var(--accent); }
  button:disabled, select:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 1.5em; font-weight: 600; }
  #moves {
    width: min(88vw, 560px); max-height: 84px; overflow-y: auto;
    background: var(--panel); border-radius: 6px; padding: 8px 12px;
    font-size: 13px; color: #b6b2ae; word-break: break-all;
  }
  #moves .repelled { color: var(--danger); }

  /* ---- 결투 ---- */
  #duel[hidden] { display: none; }
  #duel {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: #000000cc; backdrop-filter: blur(3px);
    animation: fade .18s ease-out;
  }
  @keyframes fade { from { opacity: 0 } }
  #duel .arena {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: min(6vw, 40px); padding: 28px min(6vw, 40px);
    background: var(--panel); border-radius: 6px; box-shadow: 0 8px 32px #000a;
  }
  #duel .fighter { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }
  /* 반상과 같은 밝은 칸 위에 세워야 흑백 기물이 구분된다. */
  #duel .glyph {
    width: min(26vw, 128px); aspect-ratio: 1; border-radius: 50%; background: var(--light);
    display: flex; align-items: center; justify-content: center;
    font-size: min(17vw, 84px); line-height: 1; transition: opacity .3s, filter .3s;
  }
  #duel .name { font-weight: 600; }
  #duel .stat { font-size: 12px; color: #b6b2ae; }
  #duel .bar { width: min(30vw, 150px); height: 8px; border-radius: 6px; background: #0006; overflow: hidden; }
  #duel .bar i { display: block; height: 100%; width: 100%; background: var(--accent); transition: width .18s ease-out; }
  #duel .bar i.hurt { background: var(--danger); }
  #duel .vs { font-size: 13px; letter-spacing: .2em; color: #b6b2ae; }
  #duel .verdict { font-size: 13px; min-height: 1.5em; text-align: center; margin-top: 6px; }

  /* 피격: 기물이 흔들리고 피해량이 떠오른다 */
  #duel .fighter.hit .glyph { animation: shake .22s; }
  @keyframes shake {
    25% { transform: translateX(-7px) } 50% { transform: translateX(6px) } 75% { transform: translateX(-3px) }
  }
  #duel .dmg {
    position: absolute; top: 6%; left: 50%; font-weight: 700; font-size: 22px;
    color: var(--danger); opacity: 0; pointer-events: none;
  }
  #duel .fighter.hit .dmg { animation: rise .5s ease-out; }
  #duel .dmg.crit { color: var(--crit); font-size: 30px; }
  @keyframes rise {
    from { opacity: 1; transform: translate(-50%, 0) }
    to   { opacity: 0; transform: translate(-50%, -34px) }
  }
  #duel .fighter.dead .glyph { opacity: .18; filter: grayscale(1); }
  #duel .fighter.won .glyph { transform: scale(1.12); }
</style>
</head>
<body>
  <h1>♞ GAMBIT CHESS</h1>
  <div id="status"></div>
  <div id="board"></div>
  <div id="duel" hidden>
    <div>
      <div class="arena">
        <div class="fighter atk">
          <span class="dmg"></span>
          <div class="glyph"></div><div class="name"></div><div class="stat"></div>
          <div class="bar"><i></i></div>
        </div>
        <div class="vs">VS</div>
        <div class="fighter def">
          <span class="dmg"></span>
          <div class="glyph"></div><div class="name"></div><div class="stat"></div>
          <div class="bar"><i></i></div>
        </div>
      </div>
      <div class="verdict"></div>
    </div>
  </div>
  <div id="panel">
    <select id="mode">
      <option value="duel">결투 모드</option>
      <option value="classic">정통 체스</option>
    </select>
    <select id="side">
      <option value="w">백(선공)</option>
      <option value="b">흑(후공)</option>
    </select>
    <select id="level">
      <option value="1">쉬움</option>
      <option value="2">보통</option>
      <option value="3" selected>어려움</option>
      <option value="4">매우 어려움</option>
    </select>
    <button id="undo">무르기</button>
    <button id="new">새 게임</button>
  </div>
  <div id="moves"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
