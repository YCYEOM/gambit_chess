<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gambit Chess</title>
<style>
  :root {
    --light: #eeddc0;
    --dark: #b58863;
    --bg: #262421;
    --panel: #312e2b;
    --text: #e8e6e3;
    --accent: #7fa650;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: .06em; }
  #board {
    display: grid; grid-template-columns: repeat(8, 1fr);
    width: min(88vw, 88vh, 560px); aspect-ratio: 1;
    border-radius: 6px; overflow: hidden; box-shadow: 0 8px 32px #0008;
  }
  .sq {
    display: flex; align-items: center; justify-content: center;
    font-size: min(9vw, 9vh, 54px); line-height: 1; cursor: pointer;
    position: relative; user-select: none;
  }
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  .sq.sel { box-shadow: inset 0 0 0 4px var(--accent); }
  .sq.last { background-image: linear-gradient(#ffe06655, #ffe06655); }
  .sq.check { background-image: radial-gradient(circle, #e5484d 10%, transparent 70%); }
  .sq.move::after {
    content: ''; position: absolute; width: 28%; aspect-ratio: 1;
    border-radius: 50%; background: #0004;
  }
  .sq.move.cap::after { width: 84%; border-radius: 50%; background: none; box-shadow: inset 0 0 0 5px #0004; }
  .w { color: #fff; text-shadow: 0 0 2px #000, 0 1px 2px #0009; }
  .b { color: #1a1a1a; text-shadow: 0 0 2px #fff6; }
  #panel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  button, select {
    background: var(--panel); color: var(--text); border: 1px solid #4a4643;
    border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  #status { min-height: 1.5em; font-weight: 600; }
  #moves {
    width: min(88vw, 560px); max-height: 84px; overflow-y: auto;
    background: var(--panel); border-radius: 6px; padding: 8px 12px;
    font-size: 13px; color: #b6b2ae; word-break: break-all;
  }
</style>
</head>
<body>
  <h1>♞ GAMBIT CHESS</h1>
  <div id="status"></div>
  <div id="board"></div>
  <div id="panel">
    <select id="side">
      <option value="w">백(선공)</option>
      <option value="b">흑(후공)</option>
    </select>
    <select id="level">
      <option value="1">쉬움</option>
      <option value="2">보통</option>
      <option value="3" selected>어려움</option>
      <option value="4">매우 어려움</option>
    </select>
    <button id="undo">무르기</button>
    <button id="new">새 게임</button>
  </div>
  <div id="moves"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
